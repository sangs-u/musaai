<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2C5282">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="무사이(Musai) — 현장 양중 안전성 검토 도구">
  <title>무사이 · 양중 안전성 검토</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Apple 라이트 테마 오버라이드 — style.css는 건드리지 않고 여기서 재정의 -->
  <style>
    /* ───────── 1. 팔레트 재정의 (스틸블루 + 애플 연회색) ───────── */
    :root {
      --accent:  #7B9EE0;
      --bg-body: #F5F5F7;
      --bg-app:  #F5F5F7;
      --border:  rgba(0,0,0,0.08);
    }

    /* ───────── 2. 앱 컨테이너 — 그림자 제거, 흰 외곽 ───────── */
    body { background: #F5F5F7 !important; }
    .app { background: #F5F5F7 !important; box-shadow: none !important; }
    @media (min-width: 432px) {
      .app {
        background: #FFFFFF !important;
        box-shadow: none !important;
        border: 0.5px solid rgba(0,0,0,0.08) !important;
        border-radius: 18px;
      }
    }

    /* ───────── 3. 상단바 — 흰 배경 + 0.5px 하단 border ───────── */
    .topbar {
      background: #FFFFFF !important;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      padding-top: env(safe-area-inset-top,0);
    }
    .topbar-logo { color: #1E3148 !important; }
    .topbar-logo em { color: #7B9EE0 !important; }
    .topbar-sub { color: rgba(0,0,0,0.45) !important; }
    .topbar-badge {
      background: rgba(0,0,0,0.05) !important;
      color: rgba(0,0,0,0.5) !important;
    }
    .btn-back {
      background: rgba(0,0,0,0.05) !important;
      color: #1E3148 !important;
    }
    .prog { background: rgba(0,0,0,0.08) !important; height: 4px !important; }
    .prog-fill { background: #2C5282 !important; border-radius: 0 2px 2px 0; }

    /* ───────── 4. 모든 카드 — 흰 배경 + 0.5px border, 그림자 제거 ───────── */
    .sc, .mode-card, .lb, .big-wrap, .mp-card, .rc, .mp-plan-item, .lp-card,
    .gear-btn, .viz-box, .design-load, .custom-box, .angle-calc-box, .dbody {
      background: #FFFFFF !important;
      border: 0.5px solid rgba(0,0,0,0.1) !important;
      box-shadow: none !important;
    }

    /* 선택된 카드 — 얇은 네이비 보더만 (배경 연파랑) */
    .sc.on, .mode-card.on, .lb.on, .gear-btn.on {
      background: #F0F4FA !important;
      border-color: #2C5282 !important;
      color: #2C5282 !important;
    }
    .sc.on .sc-name, .sc.on .sc-sub, .sc.on .sc-val { color: #2C5282 !important; }

    /* K카드 (네이비 블록) — 유지하되 앰버 강조만 스틸블루로 */
    .kcard {
      background: #2C5282 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .kcard-pct { color: #7B9EE0 !important; }

    /* ───────── 5. 큰 숫자들 — font-weight 300 (애플 라이트 웨이트) ───────── */
    .big-inp, .angle-num, .kcard-val, .ib-value, .rc-val, .lb-n, .vs-pct,
    .lp-pct, .dl-value, .dv, .calc-result { font-weight: 300 !important; }
    .big-inp { letter-spacing: -1px !important; }
    .angle-num { letter-spacing: -2px !important; }

    /* ───────── 6. 입력 컨트롤 — 0.5px border ───────── */
    .num-inp, .csel, .mp-ta {
      border: 0.5px solid rgba(0,0,0,0.15) !important;
      background: #FFFFFF !important;
      box-sizing: border-box;
      min-width: 0;
    }
    .num-inp:focus, .csel:focus, .mp-ta:focus {
      border-color: #2C5282 !important;
    }
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .calc-grid > div { min-width: 0; }
    .calc-grid .num-inp { width: 100%; }
    .big-wrap { border-width: 0.5px !important; }
    .big-wrap:focus-within { border-color: #2C5282 !important; }

    /* 세그먼트/단위 토글 — 배경 살짝 연하게 */
    .seg, .unit-toggle { background: rgba(0,0,0,0.04) !important; }
    .seg-b.on { background: #FFFFFF !important; box-shadow: 0 1px 2px rgba(0,0,0,0.06) !important; color: #2C5282 !important; }

    /* ───────── 7. 앰버 포인트 제거 → 스틸블루 또는 제거 ───────── */
    /* 법조문 인용 (plan 미리보기에서 쓰이지만 lifting에는 영향 없음) */
    .mp-law-quote { border-left: 3px solid #7B9EE0 !important; background: #F5F5F7 !important; }
    .mp-doc-brand em { color: #7B9EE0 !important; }

    /* ───────── 8. 버튼 — 네이비 유지, 보조 버튼만 정리 ───────── */
    .btn-n { background: #2C5282 !important; box-shadow: none !important; }
    .btn-p, .btn-reset {
      background: #FFFFFF !important;
      border: 0.5px solid rgba(0,0,0,0.15) !important;
      color: #1E3148 !important;
    }
    .calc-btn { background: #2C5282 !important; }

    /* ───────── 9. 상태 스트립·verdict — 색상 톤 유지하되 그림자 제거 ───────── */
    .vs, .verdict {
      box-shadow: none !important;
      border-width: 0.5px !important;
    }

    /* ───────── 10. 기타 정리 — 알림 박스 경계 0.5px ───────── */
    .info-box, .warn-box, .err-box {
      border-width: 0.5px !important;
    }
    .dtog {
      background: rgba(0,0,0,0.03) !important;
      border: 0.5px solid rgba(0,0,0,0.08) !important;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <button class="btn-back" id="btn-back" onclick="if(typeof S!=='undefined'&&S.step===1){location.href='index.html'}else{prev()}" title="이전 / 홈">←</button>
      <span class="topbar-logo">무사<em>이</em><span class="topbar-sub" id="top-title"></span></span>
      <span class="topbar-badge" id="top-step">1 / 6</span>
    </div>
    <div class="prog"><div class="prog-fill" id="prog" style="width:16.7%"></div></div>
  </div>
  <div class="content" id="app"></div>
</div>
<script>

const SF_SLING = 5;
const EFF_MAP = {socket:1.0,lock_24:0.95,lock_26:0.925,splice_6:0.9,splice_9:0.88,splice_12:0.86,splice_18:0.82,clip:0.75};
const WIRE  = [{l:'φ9mm',swl:750},{l:'φ10mm',swl:900},{l:'φ12mm',swl:1350},{l:'φ14mm',swl:1800},{l:'φ16mm',swl:2400},{l:'φ18mm',swl:3000},{l:'φ22mm',swl:4500},{l:'φ26mm',swl:6000},{l:'직접 입력',swl:-1},{l:'파단하중(BL)으로 계산',swl:-2}];
const BELT  = [{l:'1t급',swl:1000},{l:'2t급',swl:2000},{l:'3t급',swl:3000},{l:'5t급',swl:5000},{l:'8t급',swl:8000},{l:'10t급',swl:10000},{l:'직접 입력',swl:-1}];
const CHAIN = [{l:'G80 φ7mm',swl:1120},{l:'G80 φ8mm',swl:1500},{l:'G80 φ10mm',swl:2360},{l:'G80 φ13mm',swl:3980},{l:'G80 φ16mm',swl:6300},{l:'G80 φ19mm',swl:8600},{l:'직접 입력',swl:-1}];
const STEPS_ARR = ['','인양하중 설정','줄걸이 방식','각도 입력','슬링 검토','달기기구','종합 결과'];

/* ── 상태: 내부값 항상 kg ── */
let S = {
  step:1, unitT:true,
  weight:5000, dynK:1.2,
  mode:0, lines:2,
  alpha:60, chokeAngle:120,
  sType:'chain', sWLL:3980, sSelVal:3980,
  sCust:false, sCustBL:false,
  wireBL:10000, wireEff:1.0, wireSF:SF_SLING, wireEffType:'socket',
  hookLoad:10000,
  upShUse:false, upShType:'shackle', upShSWL:4750,
  loShUse:true,  loShType:'shackle', loShSWL:2000,
  detailOpen:{s4:false, s6:false},
};

/* ── 표시 헬퍼: 내부값(kg) → 표시용 ── */
const fmt = {
  val:  kg => !isFinite(kg)||kg<0 ? '—' : S.unitT ? (kg/1000).toFixed(2)+'t' : Math.round(kg).toLocaleString()+'kg',
  pct:  r  => (!isFinite(r)||r<=0) ? '—' : Math.round(r*100)+'%',
  inp:  kg => (!kg||kg<=0) ? '' : S.unitT ? parseFloat((kg/1000).toFixed(3)) : Math.round(kg),
  toKg: v  => { const n=parseFloat(v)||0; return S.unitT ? n*1000 : n; },
  unit: ()  => S.unitT ? 't' : 'kg',
  swlLabel: o => {
    if(o.swl<0) return o.l;
    const s = S.unitT ? (o.swl/1000).toFixed(2)+'t' : o.swl.toLocaleString()+'kg';
    return o.l+' — SWL '+s;
  },
};

const getSO = () => S.sType==='wire'?WIRE:S.sType==='belt'?BELT:CHAIN;

/* ── 계산 엔진: 항상 kg 기준 ── */
function chokeCapFactor(angleDeg) {
  if (angleDeg > 120) return 1.00;
  if (angleDeg >= 90)  return 0.86;
  if (angleDeg >= 60)  return 0.74;
  if (angleDeg >= 30)  return 0.62;
  return 0.49;
}

function calcKM() {
  const betaDeg=S.alpha/2, betaRad=betaDeg*Math.PI/180;
  let K=1.0,effN=1,invalid=false;
  const M=S.mode===1?2.0:S.mode===2?0.8:1.0;
  if(S.lines===1){effN=1;K=1.0;}
  else if(S.lines===2){
    effN=2;
    if(betaDeg>60){invalid=true;}
    else{K=1/Math.cos(betaRad);}
  } else {
    effN=3;
    if(betaDeg>60){invalid=true;}
    else{K=1/Math.cos(betaRad);}
  }
  return {K,M,effN,invalid,betaDeg};
}

function calc() {
  const W=S.weight*S.dynK;
  const {K,M,effN,invalid}=calcKM();
  let sWLL=S.sWLL;
  if(S.sType==='wire'&&S.sCustBL) sWLL=(S.wireBL*S.wireEff)/S.wireSF;
  const capFactor=S.mode===2?chokeCapFactor(S.chokeAngle):1.0;
  const effectiveSWL=sWLL*capFactor;
  const totalCap=invalid?0:(effectiveSWL*effN*M)/K;
  const Ts=invalid?Infinity:(W*K)/(effN*M);
  const sr=(totalCap>0&&sWLL>0)?W/totalCap:Infinity;
  const hr=S.hookLoad>0?W/S.hookLoad:Infinity;
  const ur=(S.upShUse&&S.upShSWL>0)?W/S.upShSWL:0;
  const lr=(S.loShUse&&S.loShSWL>0&&isFinite(Ts))?Ts/S.loShSWL:(S.loShUse&&S.loShSWL<=0?Infinity:0);
  const st=r=>(!isFinite(r)||r>1)?'ng':r>0.85?'warn':'ok';
  return {W,K,M,effN,sWLL,effectiveSWL,capFactor,totalCap,Ts,sr,hr,ur,lr,invalid,
    sS:invalid?'ng':sWLL<=0?'ng':st(sr),
    hS:S.hookLoad<=0?'ng':st(hr),
    uS:S.upShUse?(S.upShSWL<=0?'ng':st(ur)):'na',
    lS:S.loShUse?(S.loShSWL<=0?'ng':st(lr)):'na'};
}

/* ── 핸들러: 값 저장 후 render 또는 부분 업데이트 ── */
window.setUnit  = t => { S.unitT=t; render(); };
window.setWeight= v => {
  S.weight=fmt.toKg(v);
  const dp=document.getElementById('dp'); if(dp) dp.textContent=fmt.val(S.weight*S.dynK);
  const ds=document.getElementById('dp-sub'); if(ds) ds.textContent=(fmt.inp(S.weight)||0)+fmt.unit()+' × '+S.dynK;
};
window.setDynK  = k => {
  const iw=document.getElementById('iw'); if(iw) S.weight=fmt.toKg(iw.value);
  S.dynK=k; render();
};
window.setMode  = m => { S.mode=m; render(); };
window.setLines = l => { S.lines=l; render(); };

window.setAlpha = val => {
  S.alpha=parseInt(val);
  const {K,M,invalid,betaDeg}=calcKM();
  const ac=betaDeg>45?'#f59e0b':'#1E4D8C';
  const upd=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const sty=(id,p,v)=>{const e=document.getElementById(id);if(e)e.style[p]=v;};
  sty('adsp','color',ac); upd('adsp',S.alpha+'°');
  upd('adsub','β(수직선과의 각도) = '+betaDeg+'°');
  upd('kv',invalid?'사용불가':K.toFixed(3));
  upd('mv','M = '+(invalid?'NG':M.toFixed(1)));
  upd('kpct',invalid?'NG':'+'+Math.round(K*100-100)+'%');
  upd('ib-alpha',S.alpha+'°'); upd('ib-beta',betaDeg+'°');
  const svg=document.getElementById('asvg');
  if(svg) svg.innerHTML=buildAngleSVG(S.alpha,S.lines);
  updateS4();
};

window.setChokeAngle = val => {
  S.chokeAngle=parseInt(val);
  const cap=chokeCapFactor(S.chokeAngle),pct=Math.round(cap*100);
  const col=S.chokeAngle<60?'#ef4444':S.chokeAngle<120?'#f59e0b':'#1E4D8C';
  const upd=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const sty=(id,p,v)=>{const e=document.getElementById(id);if(e)e.style[p]=v;};
  sty('choke-disp','color',col); upd('choke-disp',S.chokeAngle+'°');
  sty('choke-cap','color',col);  upd('choke-cap',pct+'%');
  sty('ib-choke-cap','color',col); upd('ib-choke-cap',pct+'%');
  upd('ib-choke-angle',S.chokeAngle+'°');
  updateS4();
};

window.calcAngleFromLen = () => {
  const L=parseFloat(document.getElementById('sl-L').value)||0;
  const D=parseFloat(document.getElementById('sl-D').value)||0;
  const res=document.getElementById('angle-calc-result');
  if(!L||!D||D/2>L){res.style.color='#ef4444';res.textContent='L ≥ D÷2 이어야 합니다';return;}
  const beta=Math.asin((D/2)/L)*180/Math.PI;
  S.alpha=Math.min(Math.round(beta*2),120);
  res.style.color='#1E4D8C';
  res.textContent='α = '+S.alpha+'° (β = '+Math.round(beta)+'°) — 슬라이더에 반영됐습니다';
  const sl=document.getElementById('alpha-slider'); if(sl) sl.value=S.alpha;
  window.setAlpha(S.alpha);
};

window.setSlingType   = t => { S.sType=t;S.sCust=false;S.sCustBL=false;const o=getSO()[0];S.sSelVal=o.swl;S.sWLL=o.swl>0?o.swl:0;render(); };
window.setSlingDDL    = v => {
  S.sSelVal=parseInt(v);S.sCust=false;S.sCustBL=false;
  if(S.sSelVal===-1){S.sCust=true;S.sWLL=0;}
  else if(S.sSelVal===-2){S.sCustBL=true;S.sWLL=0;}
  else{S.sWLL=S.sSelVal;}
  render();
};
window.setSlingCustom = v => { S.sWLL=fmt.toKg(v); updateS4(); };
window.setWireBL      = v => { S.wireBL=fmt.toKg(v); updateS4(); };
window.setWireEff     = v => { S.wireEffType=v;S.wireEff=EFF_MAP[v]||1.0; updateS4(); };
window.setWireSF      = v => { S.wireSF=Math.max(1,parseFloat(v)||SF_SLING); updateS4(); };
window.setHookLoad    = v => { S.hookLoad=fmt.toKg(v); };
window.toggleGear     = (p,c) => { S[p+'ShUse']=c; render(); };
window.setGearType    = (p,t) => { S[p+'ShType']=t; render(); };
window.setGearSWL     = (p,v) => { S[p+'ShSWL']=fmt.toKg(v); updateS5(p); };
window.toggleDetail   = k => {
  S.detailOpen[k]=!S.detailOpen[k];
  const b=document.getElementById('detail-'+k); if(b) b.style.display=S.detailOpen[k]?'block':'none';
  const t=document.getElementById('dtog-'+k); if(t) t.querySelector('.darr').textContent=S.detailOpen[k]?'▲':'▼';
};

/* ── 부분 업데이트 ── */
function updateS4() { const e=document.getElementById('s4-result'); if(e) e.innerHTML=renderS4Result(); }
function updateS5(p) { const e=document.getElementById('s5-result-'+p); if(e) e.innerHTML=renderGearResult(p); }

/* ── 결과 HTML ── */
function renderS4Result() {
  const c=calc();
  const ico={ok:icoSVG('ok',22),warn:icoSVG('warn',22),ng:icoSVG('ng',22)};
  const msg={ok:'슬링 사용 가능',warn:'여유 부족 — 재검토 권고',ng:'허용하중 초과 — 규격 변경 필요'};
  const sub={ok:'설계 인양하중이 종합 허용하중 이내입니다',warn:'85% 이상 사용 중, 재검토를 권고합니다',ng:c.sWLL<=0?'SWL을 입력하세요':'슬링을 더 두꺼운 규격으로 교체하세요'};
  const sf=isFinite(c.totalCap/c.W)&&c.W>0?(c.totalCap/c.W).toFixed(2)+'배':'—';
  const chokeNote=S.mode===2?`<div style="background:#fef9c3;border-radius:8px;padding:8px 10px;margin-top:4px;font-size:11px;color:#854d0e;">조임각 ${S.chokeAngle}° → SWL ${fmt.val(c.sWLL)} × ${Math.round(c.capFactor*100)}% = <strong>${fmt.val(c.effectiveSWL)}</strong> 실제 허용</div>`:'';
  return `
  <div class="rc">
    <div class="rc-section">
      <div class="rc-section-label">${S.lines}줄 ${['수직','바스켓','초크'][S.mode]} 걸이 — 전체 하중 비교</div>
      <div class="rc-row">
        <div class="rc-lbl"><b>설계 인양하중 (W)</b>실제로 들어올려야 할 하중</div>
        <div class="rc-val" style="color:#ef4444;">${fmt.val(c.W)}</div>
      </div>
      <div class="rc-row">
        <div class="rc-lbl"><b>종합 허용하중</b>${S.lines}줄 합산 최대 인양 가능</div>
        <div class="rc-val" style="color:#22c55e;">${fmt.val(c.totalCap)}</div>
      </div>
    </div>
    <div class="rc-section">
      <div class="rc-section-label">줄 1가닥 비교</div>
      <div class="rc-row">
        <div class="rc-lbl"><b>줄 1가닥에 걸리는 힘</b>이 줄이 버텨야 하는 하중</div>
        <div class="rc-val" style="color:#ef4444;">${fmt.val(c.Ts)}<small>줄당 장력</small></div>
      </div>
      <div class="rc-row">
        <div class="rc-lbl"><b>줄 1가닥 허용하중</b>${S.mode===2?'조임각 적용 후':'선택한 슬링 SWL'}</div>
        <div class="rc-val" style="color:#22c55e;">${fmt.val(c.effectiveSWL)}<small>유효 SWL</small></div>
      </div>
    </div>
    ${chokeNote}
  </div>
  <div class="vs ${c.sS}">
    <div class="vs-ico">${ico[c.sS]}</div>
    <div class="vs-body"><div class="vs-main">${msg[c.sS]}</div><div class="vs-sub">${sub[c.sS]}</div></div>
    <div class="vs-pct">${fmt.pct(c.sr)}</div>
  </div>
  <button class="dtog" id="dtog-s4" onclick="toggleDetail('s4')">
    📐 KOSHA 계산 근거 보기 <span class="darr">${S.detailOpen.s4?'▲':'▼'}</span>
  </button>
  <div class="dbody" id="detail-s4" style="display:${S.detailOpen.s4?'block':'none'}">
    <div class="dr"><span class="dk">설계 인양하중 (W)</span><span class="dv">${fmt.val(S.weight)} × ${S.dynK} = ${fmt.val(c.W)}</span></div>
    <div class="dr"><span class="dk">K(각도계수) = 1/cos(β)</span><span class="dv">${c.invalid?'사용불가':c.K.toFixed(3)}</span></div>

function renderGearResult(prefix) {
  const c=calc(), use=S[prefix+'ShUse'], swl=S[prefix+'ShSWL'], load=prefix==='up'?c.W:c.Ts;
  if(!use) return '<div style="font-size:12px;color:#94a3b8;padding:6px 0;">미사용</div>';
  if(swl<=0) return '<div class="err-box" style="margin:0;padding:8px 12px;">SWL을 입력하세요</div>';
  if(!isFinite(load)) return '<div class="err-box" style="margin:0;padding:8px 12px;">슬링 각도 초과 — 검토 불가</div>';
  const r=load/swl, st=r>1?'ng':r>0.85?'warn':'ok';
  return `<div class="vs ${st}" style="margin-bottom:0;">
    <div class="vs-ico">${icoSVG(st,22)}</div>
    <div class="vs-body"><div class="vs-main">${fmt.val(load)} 작용 / ${fmt.val(swl)} 허용</div>
    <div class="vs-sub">${prefix==='up'?'전체 하중 기준':'줄당 장력 기준'}</div></div>
    <div class="vs-pct">${fmt.pct(r)}</div>
  </div>`;
}

/* ── SVG helpers ── */
function icoSVG(st, sz) {
  sz = sz || 22;
  if (st === 'ok')   return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" fill="#22C55E"/><path d="M13 24.5 L21 32.5 L35 15.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if (st === 'warn') return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 48 48" fill="none"><path d="M24 5 L44 41 H4 Z" fill="#F59E0B"/><line x1="24" y1="18" x2="24" y2="30" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="36" r="2.5" fill="#fff"/></svg>';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" fill="#EF4444"/><path d="M15 15 L33 33 M33 15 L15 33" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>';
}
function getModeIcon(mode) {

  if (mode === 0) {
    s += `<ellipse cx="27" cy="9"  rx="5" ry="6" fill="none" stroke="${col}" stroke-width="2.2"/>`;
    s += `<line x1="27" y1="15" x2="27" y2="40" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<ellipse cx="27" cy="46" rx="5" ry="6" fill="none" stroke="${col}" stroke-width="2.2"/>`;
  } else if (mode === 1) {
    s += `<ellipse cx="16" cy="9" rx="5" ry="6" fill="none" stroke="${col}" stroke-width="2.2"/>`;
    s += `<ellipse cx="38" cy="9" rx="5" ry="6" fill="none" stroke="${col}" stroke-width="2.2"/>`;
    s += `<line x1="16" y1="15" x2="16" y2="36" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M 16 36 Q 27 50 38 36" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<line x1="38" y1="36" x2="38" y2="15" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
  } else {
    s += `<ellipse cx="27" cy="8" rx="5" ry="6" fill="none" stroke="${col}" stroke-width="2.2"/>`;
    s += `<line x1="27" y1="14" x2="27" y2="29" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M 27 29 Q 40 33 38 42 Q 36 51 27 50 Q 18 51 16 42 Q 14 33 27 29 Z" fill="none" stroke="${col}" stroke-width="2.2"/>`;
    s += `<line x1="21" y1="29" x2="11" y2="29" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>`;
    s += `<path d="M 14 26 L 11 29 L 14 32" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  s += `</svg>`;
  return s;
}
function buildAngleSVG(alpha, lines) {
  const VW=280, VH=178, cx=VW/2, hookY=24, L=80;
  const betaRad = (alpha/2) * Math.PI / 180;
  const sp   = L * Math.sin(betaRad);
  const drop = L * Math.cos(betaRad);
  const lx=cx-sp, rx=cx+sp, ly=hookY+drop;
  const bW = Math.max(rx-lx+36, 80);
  const bx = cx - bW/2;
  const betaDeg = alpha/2;
  const isWarn = betaDeg > 45;
  const sCol = isWarn ? '#f59e0b' : '#1a3a5c';
  const sw = 2.6;

  // 라벨 배경 박스 그리는 헬퍼
  const labelBox = (x, y, txt, col, anchor='middle') => {
    const w = txt.length * 8 + 12, h = 18, rx2 = 5;
    const bx2 = anchor==='middle' ? x-w/2 : anchor==='start' ? x-2 : x-w+2;
    return `<rect x="${bx2}" y="${y-13}" width="${w}" height="${h}" rx="${rx2}" fill="${col}" opacity="0.9"/>
      <text x="${x}" y="${y}" font-size="12" fill="#fff" font-weight="800" font-family="monospace" text-anchor="${anchor}">${txt}</text>`;
  };

  let s = `<svg width="100%" viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg">`;

  // 우측 상단 α 배지
  const badgeCol = alpha >= 120 ? '#ef4444' : '#1a3a5c';
  s += `<rect x="175" y="6" width="98" height="44" rx="8" fill="${badgeCol}"/>`;
  s += `<text x="224" y="21" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.65)">두 줄 사이 각도</text>`;
  s += `<text x="224" y="40" text-anchor="middle" font-size="17" fill="#fff" font-weight="800" font-family="monospace">α = ${alpha}°</text>`;

  const hx = cx, hy = hookY + 8; // 훅 = 부채꼴 중심 (고정)

  // ── 수직 기준선 ──
  s += `<line x1="${hx}" y1="${hy}" x2="${hx}" y2="${ly}" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6"/>`;

  // ── α 호: 왼쪽슬링(-β)→오른쪽슬링(+β), 화물 방향으로 볼록 ──
  // sweep=0(반시계): 왼쪽→오른쪽 반시계 → 아래(화물)로 볼록
  const arA = 28;
  if (alpha > 0 && lines >= 2) {
    const aSx = hx - arA * Math.sin(betaRad),   aSy = hy + arA * Math.cos(betaRad);
    const aEx = hx + arA * Math.sin(betaRad),   aEy = hy + arA * Math.cos(betaRad);
    s += `<path d="M ${aSx} ${aSy} A ${arA} ${arA} 0 0 0 ${aEx} ${aEy}"
      stroke="#1a3a5c" stroke-width="2" fill="rgba(26,58,92,0.07)"/>`;
    s += labelBox(hx, hy + arA * Math.cos(betaRad) + 16, 'α', '#1a3a5c', 'middle');
  }

  // ── 슬링 선 ──
  if (lines <= 1) {
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${cx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
  } else if (lines === 2) {
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${lx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${rx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
  } else if (lines === 3) {
    // 평면도 개념: 뒷줄 1개를 좌측으로 12px 오프셋한 점선
    const off = 12;
    s += `<line x1="${cx-off}" y1="${hookY+8}" x2="${lx-off}" y2="${ly}"
      stroke="${sCol}" stroke-width="1.6" stroke-dasharray="5 3" opacity="0.45" stroke-linecap="round"/>`;
    // 앞줄 2개
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${lx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${rx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
  } else {
    // 4줄: 뒷줄 2개 점선 (좌우 오프셋), 앞줄 2개 실선
    const off = 10;
    s += `<line x1="${cx-off}" y1="${hookY+8}" x2="${lx-off}" y2="${ly}"
      stroke="${sCol}" stroke-width="1.6" stroke-dasharray="5 3" opacity="0.45" stroke-linecap="round"/>`;
    s += `<line x1="${cx+off}" y1="${hookY+8}" x2="${rx+off}" y2="${ly}"
      stroke="${sCol}" stroke-width="1.6" stroke-dasharray="5 3" opacity="0.45" stroke-linecap="round"/>`;
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${lx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
    s += `<line x1="${cx}" y1="${hookY+8}" x2="${rx}" y2="${ly}" stroke="${sCol}" stroke-width="${sw}" stroke-linecap="round"/>`;
  }

  // ── 화물 박스 ──
  const boxCol = alpha >= 120 ? '#fca5a5' : '#c8d6e5';
  const boxStroke = alpha >= 120 ? '#ef4444' : '#1a3a5c';
  s += `<rect x="${bx}" y="${ly}" width="${bW}" height="26" rx="5" fill="${boxCol}" stroke="${boxStroke}" stroke-width="1.5"/>`;
  s += `<text x="${cx}" y="${ly+17}" text-anchor="middle" font-size="11" font-weight="700" fill="${boxStroke}">화물</text>`;

  // ── 훅 ──
  s += `<circle cx="${cx}" cy="${hookY}" r="7" fill="#1a3a5c"/>`;
  s += `<text x="${cx}" y="${hookY-12}" text-anchor="middle" font-size="10" fill="#1a3a5c" font-weight="700">훅</text>`;

  // ── 범례 제거 — β 정보는 그림 외부 info bar로 이동 ──
  s += `</svg>`;
  return s;
}

  </div>`:''}
  <div id="s4-result">${renderS4Result()}</div>
  <div class="nav"><button class="btn-p" onclick="prev()">이전</button><button class="btn-n" onclick="next()">다음 →</button></div>`;
}

function gearSection(prefix, title, note) {
  const use=S[prefix+'ShUse'], type=S[prefix+'ShType'], swl=S[prefix+'ShSWL'];
  const gears=[
    {t:'shackle',icon:'<svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M15 26 L15 36 Q15 45 24 45 Q33 45 33 36 L33 26" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="10" y1="26" x2="38" y2="26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="38" cy="26" r="5.5" fill="currentColor"/><line x1="36" y1="26" x2="40" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="38" y1="24" x2="38" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>',name:'샤클'},
    {t:'lug',icon:'<svg width="24" height="24" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="13" r="6.5" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M17 18 L13 40 L35 40 L31 18" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="24" y1="19" x2="24" y2="40" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/></svg>',name:'인양러그'},
    {t:'other',icon:'<svg width="24" height="24" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5 3"/><circle cx="15" cy="24" r="3" fill="currentColor"/><circle cx="24" cy="24" r="3" fill="currentColor"/><circle cx="33" cy="24" r="3" fill="currentColor"/></svg>',name:'기타'}
  ];
  const shackleRef=type==='shackle'?`
    <div style="background:#f0f9ff;border-radius:8px;padding:10px 12px;margin-bottom:10px;">
      <div style="font-size:10px;font-weight:700;color:#0369a1;margin-bottom:6px;">📌 샤클 표준 SWL 참고 (G80 기준)</div>
      <div style="font-size:11px;color:#0c4a6e;line-height:2;">
        1/2" → <strong>2.0t</strong> | 5/8" → <strong>3.25t</strong><br>
        3/4" → <strong>4.75t</strong> | 7/8" → <strong>6.5t</strong><br>
        1" → <strong>8.5t</strong> | 1-1/4" → <strong>12.0t</strong>
      </div>
      <div style="font-size:10px;color:#94a3b8;margin-top:4px;">※ 제조사·등급별 상이 — 반드시 제품 표시값 확인</div>
    </div>`:'';
  const lugNote=type==='lug'?`<div class="info-box" style="margin-bottom:10px;font-size:11px;">💡 <strong>인양러그</strong> — 구조검토 완료 후 검토서의 허용하중을 입력하세요.<br><span style="color:#ef4444;font-weight:700;">구조검토 없이 사용 금지</span></div>`:'';
  const otherNote=type==='other'?`<div class="info-box" style="margin-bottom:10px;font-size:11px;">💡 <strong>기타 달기기구</strong> — 제조사 인증서 또는 구조검토서의 허용하중을 입력하세요.</div>`:'';
  return `<div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;">
    <div class="tog-row" style="padding-top:0;${use?'margin-bottom:12px;':''}">
      <div><div class="tog-label">${title}</div><div class="tog-sub">${note}</div></div>
      <label class="tog-sw"><input type="checkbox" ${use?'checked':''} onchange="toggleGear('${prefix}',this.checked)"><div class="tog-track"></div></label>
    </div>
    ${use?`
    <div class="gear-grid">
      ${gears.map(g=>`<div class="gear-btn ${type===g.t?'on':''}" onclick="setGearType('${prefix}','${g.t}')">
        <span class="gear-icon">${g.icon}</span>${g.name}</div>`).join('')}
    </div>
    ${shackleRef}${lugNote}${otherNote}
    <div class="inp-row">
      <input type="number" class="num-inp" placeholder="SWL 입력" value="${fmt.inp(swl)||''}" inputmode="decimal" oninput="setGearSWL('${prefix}',this.value)">
      <span class="inp-unit">${fmt.unit()}</span>
    </div>
    <div id="s5-result-${prefix}">${renderGearResult(prefix)}</div>`:''}
  </div>`;
}

function s5() {
  return `
  <div class="q-title">달기기구를<br>확인하세요</div>
  <div class="q-sub">크레인 정격하중과 달기기구의 안전작업하중을 입력하세요</div>
  <div class="q-hint">크레인 운전석 또는 붐 차트에서 현재 반경의 정격하중을 확인하세요</div>
  <div class="sec-label">크레인 정격하중 (현재 작업반경 기준)</div>
  <div class="inp-row">
    <input type="number" class="num-inp" value="${fmt.inp(S.hookLoad)||''}" inputmode="decimal" placeholder="0" oninput="setHookLoad(this.value)">
    <span class="inp-unit">${fmt.unit()}</span>
  </div>
  ${S.hookLoad<=0?`<div class="err-box" style="margin-top:-4px;">🚫 <strong>크레인 정격하중을 입력하세요</strong> — 현재 작업반경 기준 정격하중을 크레인 사양서에서 확인하세요.</div>`:''}
  ${gearSection('up','상부 달기기구','크레인 훅과 슬링 사이 — 기본 OFF')}
  ${gearSection('lo','하부 달기기구','슬링과 화물 연결부 — 기본 ON')}
  <div class="info-box" style="font-size:11px;">
    💡 <strong>달기기구 안전계수 기준 (산업안전보건기준 제163조)</strong><br>
    샤클·훅 독립형: <strong>3 이상</strong> / 기타 달기기구: <strong>4 이상</strong>
  </div>
  <div class="nav"><button class="btn-p" onclick="prev()">이전</button><button class="btn-n" onclick="next()">종합 결과 →</button></div>`;
}

function s6() {
  const c=calc();
  const items=[{n:'크레인 정격하중',load:c.W,swl:S.hookLoad,r:c.hr,s:c.hS,sub:'작용 '+fmt.val(c.W)+' / 정격 '+fmt.val(S.hookLoad)}];
  if(S.upShUse&&S.upShSWL>0) items.push({n:'상부 달기기구',load:c.W,swl:S.upShSWL,r:c.ur,s:c.uS,sub:fmt.val(c.W)+' / SWL '+fmt.val(S.upShSWL)});
  items.push({n:'슬링 ×'+c.effN+'가닥',load:c.Ts,swl:c.effectiveSWL,r:c.sr,s:c.sS,sub:'줄당 '+fmt.val(c.Ts)+' / 허용 '+fmt.val(c.effectiveSWL)});
  if(S.loShUse&&S.loShSWL>0) items.push({n:'하부 달기기구',load:c.Ts,swl:S.loShSWL,r:c.lr,s:c.lS,sub:'줄당 '+fmt.val(c.Ts)+' / SWL '+fmt.val(S.loShSWL)});
  const hasNg=items.some(i=>i.s==='ng'), hasWarn=items.some(i=>i.s==='warn');
  const ov=hasNg?'ng':hasWarn?'warn':'ok';
  const ico={ok:icoSVG('ok',56),warn:icoSVG('warn',56),ng:icoSVG('ng',56)};
  const ovMsg={
    ok:{main:'모든 부재 이상 없음',note:'작업 진행 가능'},
    warn:{main:'경계 부재 존재',note:'관리감독자 확인 후 진행'},
    ng:{main:'허용하중 초과',note:'즉시 작업 중단'}
  };
  const sf=isFinite(c.totalCap/c.W)&&c.W>0?(c.totalCap/c.W).toFixed(2)+'배':'—';
  return `
  <div class="q-hint" style="margin-bottom:12px;">하중 전달 경로의 모든 부재가 OK여야 작업 가능합니다</div>
  <div class="verdict ${ov}">
    <span class="v-ico">${ico[ov]}</span>
    <div class="v-txt">${ovMsg[ov].main}</div>
    <div class="v-note">${ovMsg[ov].note}</div>
  </div>
  <div class="sec-label">하중 전달 경로 검토</div>
  <div class="lp-card">
    ${items.map(it=>`<div class="lp-item">
      <div class="lp-dot ${it.s}"></div><div class="lp-name">${it.n}</div>
      <div class="lp-sub">${it.sub}</div>
      <div class="lp-pct ${it.s}">${fmt.pct(it.r)}</div>
    </div>`).join('')}
  </div>
  <button class="dtog" id="dtog-s6" onclick="toggleDetail('s6')">
    📋 KOSHA 전체 계산 근거 보기 <span class="darr">${S.detailOpen.s6?'▲':'▼'}</span>
  </button>
  <div class="dbody" id="detail-s6" style="display:${S.detailOpen.s6?'block':'none'}">
    <div class="dr"><span class="dk">화물중량 × 동하중계수</span><span class="dv">${fmt.val(S.weight)} × ${S.dynK} = ${fmt.val(c.W)}</span></div>
    <div class="dr"><span class="dk">줄 수 / 걸이방식</span><span class="dv">${c.effN}줄 / ${['수직','바스켓','초크'][S.mode]}</span></div>
    <div class="dr"><span class="dk">K(각도계수)</span><span class="dv">${c.invalid?'사용불가':c.K.toFixed(3)}</span></div>
    <div class="dr"><span class="dk">모드계수 M</span><span class="dv">${c.M.toFixed(1)}</span></div>
    ${S.mode===2?`<div class="dr"><span class="dk">조임각 / 정격용량계수</span><span class="dv">${S.chokeAngle}° / ${Math.round(c.capFactor*100)}%</span></div>`:''}
    <div class="dr"><span class="dk">슬링 SWL (1가닥)</span><span class="dv">${fmt.val(c.sWLL)}</span></div>
    <div class="dr"><span class="dk">유효 SWL (조임각 적용)</span><span class="dv">${fmt.val(c.effectiveSWL)}</span></div>
    <div class="dr"><span class="dk">Ts(줄당 장력)</span><span class="dv">${fmt.val(c.Ts)}</span></div>
    <div class="dr"><span class="dk">종합 허용하중</span><span class="dv">${fmt.val(c.totalCap)}</span></div>
    <div class="dr"><span class="dk">사용률</span><span class="dv">${fmt.pct(c.sr)}</span></div>
    <div class="dr"><span class="dk">안전율 (종합허용 ÷ W)</span><span class="dv">${sf}</span></div>
    <div class="dref">📌 KOSHA GUIDE B-M-12-2025 / G-133-2020 / G-134-2023 기준<br>산업안전보건기준에 관한 규칙 제163조·제164조 적용</div>
  </div>
  <button class="btn-reset" onclick="S.step=1;render()">🔄 처음부터 다시 검토하기</button>
  <button class="btn-reset" style="margin-top:8px;background:#2C5282!important;color:#fff!important;border-color:#2C5282!important;" onclick="location.href='index.html'">🏠 홈으로 돌아가기</button>`;
}

const FNS=[null,s1,s2,s3,s4,s5,s6];
window.next=()=>{if(S.step<6)S.step++;render();};
window.prev=()=>{if(S.step>1)S.step--;render();};

function render(){
  document.getElementById('top-step').textContent=S.step+' / 6';
  document.getElementById('top-title').textContent=STEPS_ARR[S.step]||'';
  document.getElementById('prog').style.width=Math.round(S.step/6*100)+'%';
  document.getElementById('btn-back').style.opacity=S.step>1?'1':'0.25';
  document.getElementById('app').innerHTML=FNS[S.step]();
  document.getElementById('app').scrollTop=0;
  lucide.createIcons();
  /* step 6 도달 시 작업계획서로 결과 전달 */
  if (S.step === 6) {
    try {
      var c = calc(S);
      var _v = (c.sS==='ng'||c.hS==='ng') ? 'ng' : (c.sS==='warn'||c.hS==='warn') ? 'warn' : 'ok';
      var _sf = (isFinite(c.totalCap/c.W)&&c.W>0) ? (c.totalCap/c.W).toFixed(2) : null;
      localStorage.setItem('musai_lifting_last', JSON.stringify({
        verdict:      _v,
        result:       {ok:'이상없음',warn:'주의',ng:'부적합'}[_v],
        W:            c.W,
        lines:        c.effN,
        modeLabel:    ['수직','바스켓','초크'][S.mode]||'',
        sTypeLabel:   {wire:'와이어로프',belt:'섬유벨트',chain:'체인'}[S.sType]||S.sType,
        alpha:        S.alpha,
        sWLL:         c.sWLL,
        effectiveSWL: c.effectiveSWL,
        Ts:           c.Ts,
        totalCap:     c.totalCap,
        ratio:        isFinite(c.sr) ? Math.round(c.sr*100) : null,
        sf:           _sf,
        timestamp:    new Date().toLocaleDateString('ko-KR')
      }));
    } catch(e) {}
  }
}
render();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
